// Shader cache warmup config for cs2mac. Loaded via +exec warmup.cfg at map start.
// Goal: force D3DMetal to compile every pipeline we are likely to hit in a real round so the
// on-disk cache is populated before actual play. See docs/TUNING.md on first-session shader stalls.

sv_cheats 1
mp_warmup_end
bot_quota 0
mp_freezetime 0
mp_roundtime 60
mp_limitteams 0
mp_autoteambalance 0
sv_infinite_ammo 1
god 1
noclip
impulse 101

// Give every weapon: forces viewmodel materials, HUD ammo panels, shell eject particles.
give weapon_knife
give weapon_c4
give weapon_flashbang
give weapon_hegrenade
give weapon_smokegrenade
give weapon_molotov
give weapon_incgrenade
give weapon_decoy
give weapon_taser
give weapon_glock
give weapon_usp_silencer
give weapon_p2000
give weapon_elite
give weapon_p250
give weapon_tec9
give weapon_cz75a
give weapon_fiveseven
give weapon_deagle
give weapon_revolver
give weapon_nova
give weapon_xm1014
give weapon_mag7
give weapon_sawedoff
give weapon_mac10
give weapon_mp9
give weapon_mp7
give weapon_mp5sd
give weapon_ump45
give weapon_bizon
give weapon_p90
give weapon_galilar
give weapon_famas
give weapon_ak47
give weapon_m4a1
give weapon_m4a1_silencer
give weapon_sg556
give weapon_aug
give weapon_ssg08
give weapon_awp
give weapon_scar20
give weapon_g3sg1
give weapon_m249
give weapon_negev

// Scope cycle: forces scope overlay shaders and lens-blur post pass.
use weapon_awp
+attack2
-attack2
use weapon_ssg08
+attack2
-attack2
use weapon_sg556
+attack2
-attack2
use weapon_aug
+attack2
-attack2

// Post-processing: HDR, tonemap, bloom, tracer, particle paths compile.
mat_hdr_level 2
mat_postprocess_enable 1
r_drawparticles 1
r_drawtracers_firstperson 1
cl_show_splashes 1

echo CS2MAC_WARMUP_DONE
